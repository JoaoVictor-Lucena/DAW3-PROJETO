name: Publicar imagem no Docker Hub

# Push na main: gera e publica a imagem (latest + SHA do commit).
# Pull request: só gera a imagem, para pegar erro de build antes do merge.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  IMAGEM: ${{ secrets.DOCKERHUB_USERNAME || 'devlucas07' }}/marketplace-frontend

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir as tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build (e push fora de pull request)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BACKEND_URL=http://backend:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max
